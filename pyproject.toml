[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro"
version = "2.0.0"
description = "Neuro Autonomous Coding System - Free-first enterprise app builder"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Krish Banker"}
]
keywords = [
    "autonomous-agent",
    "ai-coder",
    "code-generation",
    "multi-model",
    "free-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Coding Tools",
]

# ── CORE: only what's needed to boot and route ──────────────────────────────
dependencies = [
    "groq>=0.4.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "json-repair>=0.39.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2020.1.16",
    "huggingface-hub>=0.23.0",
]

# ── OPTIONAL EXTRAS ─────────────────────────────────────────────────────────
[project.optional-dependencies]

# AI providers beyond the core three
providers = [
    "mistralai>=1.0.0",
    "cohere>=5.0.0",
    "together>=1.3.0",
]

# Visual analysis: video download, frame extraction, image processing
visual = [
    "yt-dlp>=2024.1.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

# Browser automation and UI testing
browser = [
    "playwright>=1.40.0",
]

# Persistent vector memory (chromadb + sqlite-vec — correct package name)
memory = [
    "chromadb>=0.4.0",
    "sqlite-vec>=0.1.0",
]

# Web research tools
research = [
    "tavily-python>=0.5.0",
]

# Dev/testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Install everything at once
all = [
    "mistralai>=1.0.0",
    "cohere>=5.0.0",
    "together>=1.3.0",
    "yt-dlp>=2024.1.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "playwright>=1.40.0",
    "chromadb>=0.4.0",
    "sqlite-vec>=0.1.0",
    "tavily-python>=0.5.0",
]

[project.scripts]
neuro  = "neuro.__main__:main"
nuero  = "neuro.__main__:main"

[project.urls]
Homepage      = "https://github.com/krishbanker1/Nuero-agentic-ai"
Documentation = "https://github.com/krishbanker1/Nuero-agentic-ai#readme"
Repository    = "https://github.com/krishbanker1/Nuero-agentic-ai"
Issues        = "https://github.com/krishbanker1/Nuero-agentic-ai/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["neuro*"]

[tool.setuptools.package-data]
neuro = ["py.typed"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length    = 120
target-version = "py310"
exclude = [".git", "__pycache__", ".pytest_cache", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901", "UP007"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*"     = ["F811", "F401"]

[tool.mypy]
python_version      = "3.10"
warn_return_any     = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build", "dist", "*.egg-info"]

[tool.coverage.run]
source = ["neuro"]
branch = true
omit   = ["*/tests/*", "*/__pycache__/*", "*/build/*", "*/dist/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

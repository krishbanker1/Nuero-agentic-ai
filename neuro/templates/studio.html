<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neuro Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #2a2a3a; margin-bottom: 30px; }
        h1 { font-size: 2em; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .prompt-box { background: #1a1a24; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a3a; }
        textarea { width: 100%; min-height: 120px; background: #0a0a0f; border: 1px solid #3a3a4a; border-radius: 8px; padding: 15px; color: #e0e0e0; font-size: 16px; resize: vertical; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; align-items: center; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .secondary { background: #2a2a3a; }
        select, input[type="number"] { background: #1a1a24; border: 1px solid #3a3a4a; border-radius: 8px; padding: 10px; color: #e0e0e0; }
        .providers { display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0; }
        .provider { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #1a1a24; border-radius: 20px; font-size: 14px; }
        .provider.healthy { color: #4ade80; }
        .provider.unhealthy { color: #f87171; }
        .status { background: #1a1a24; border-radius: 8px; padding: 20px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .status-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a3a; }
        .preview-controls { display: flex; gap: 10px; margin-top: 15px; }
        .upload-btn { position: relative; overflow: hidden; }
        .upload-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5em; }
            .controls { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Neuro Studio</h1>
            <p>Autonomous App Builder</p>
        </header>
        
        <div class="prompt-box">
            <textarea id="goal" placeholder="Describe what you want to build..."></textarea>
            
            <div class="controls">
                <button id="submitBtn" onclick="submitGoal()">Run Agent</button>
                <label class="upload-btn secondary">
                    <button class="secondary">Add Screenshot</button>
                    <input type="file" accept="image/*" multiple onchange="handleUpload(this.files)">
                </label>
                <select id="workingDir">
                    <option value=".">Current Dir</option>
                    <option value="/tmp/neuro-workspace">Temp Workspace</option>
                </select>
                <input type="number" id="maxSteps" value="50" min="1" max="200" style="width: 80px;">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="dryRun"> Dry Run
                </label>
            </div>
            
            <div id="uploads" style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;"></div>
        </div>
        
        <div class="providers" id="providers">
            <div class="provider">Loading...</div>
        </div>
        
        <div class="preview-controls">
            <button class="secondary" onclick="quickPreview()">Quick Preview</button>
            <button class="secondary" onclick="launchPreview()">Launch Preview</button>
            <button class="secondary" onclick="stopPreview()">Stop Preview</button>
            <span id="previewStatus" style="margin-left: 10px; color: #4ade80;"></span>
        </div>
        
        <div class="status" id="status">
            <div class="status-item">
                <span>Ready to build...</span>
            </div>
        </div>
    </div>
    
    <script>
        var API_BASE = '';
        var uploadPaths = [];
        
        async function refreshProviders() {
            try {
                var res = await fetch(API_BASE + '/api/health');
                var data = await res.json();
                var container = document.getElementById('providers');
                var html = '';
                for (var name in data.providers) {
                    var info = data.providers[name];
                    var cls = info.status === 'healthy' ? 'healthy' : 'unhealthy';
                    var icon = info.status === 'healthy' ? 'OK' : 'X';
                    html += '<div class="provider ' + cls + '">' + icon + ' ' + name + ' (' + info.count + ' keys)</div>';
                }
                container.innerHTML = html || '<div class="provider">No providers configured</div>';
            } catch (e) {
                document.getElementById('providers').innerHTML = '<div class="provider unhealthy">Failed to load</div>';
            }
        }
        
        async function submitGoal() {
            var btn = document.getElementById('submitBtn');
            var goal = document.getElementById('goal').value.trim();
            
            if (!goal) { alert('Please enter a goal'); return; }
            
            btn.disabled = true;
            btn.textContent = 'Building...';
            
            try {
                var res = await fetch(API_BASE + '/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        goal: goal,
                        working_dir: document.getElementById('workingDir').value,
                        dry_run: document.getElementById('dryRun').checked,
                        max_steps: parseInt(document.getElementById('maxSteps').value),
                        screenshots: uploadPaths
                    })
                });
                
                var data = await res.json();
                updateStatus(data);
            } catch (e) {
                updateStatus({ success: false, error: e.message });
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run Agent';
            }
        }
        
        function updateStatus(data) {
            var status = document.getElementById('status');
            var html = '';
            html += '<div class="status-item"><span>Status</span><span>' + (data.status || 'unknown') + '</span></div>';
            html += '<div class="status-item"><span>Success</span><span>' + (data.success ? 'OK' : 'FAIL') + '</span></div>';
            if (data.steps) html += '<div class="status-item"><span>Steps</span><span>' + data.steps + '</span></div>';
            if (data.duration_ms) html += '<div class="status-item"><span>Duration</span><span>' + (data.duration_ms/1000).toFixed(1) + 's</span></div>';
            if (data.files_changed && data.files_changed.length) html += '<div class="status-item"><span>Files Changed</span><span>' + data.files_changed.length + '</span></div>';
            if (data.files_created && data.files_created.length) {
                html += '<div class="status-item"><span>Files Created</span><span>' + data.files_created.length + '</span></div>';
                html += '<div style="margin-top:5px;font-size:12px;"><b>Created:</b><br>';
                data.files_created.forEach(function(f) {
                    html += '<span style="background:#2a2a3a;padding:2px 6px;border-radius:4px;margin:2px;display:inline-block;">' + f + '</span> ';
                });
                html += '</div>';
            }
            if (data.working_dir) html += '<div class="status-item"><span>Working Dir</span><span style="font-size:11px;">' + data.working_dir + '</span></div>';
            if (data.error) html += '<div class="status-item" style="color:#f87171"><span>Error</span><span>' + data.error + '</span></div>';
            if (data.output) html += '<div class="status-item"><pre style="white-space:pre-wrap;margin-top:10px;font-size:12px;">' + data.output + '</pre></div>';
            status.innerHTML = html;
        }
        
        async function launchPreview() {
            var workspace = document.getElementById('workingDir').value;
            var res = await fetch(API_BASE + '/api/launch?workspace=' + encodeURIComponent(workspace));
            var data = await res.json();
            var previewStatus = document.getElementById('previewStatus');
            if (data.success) {
                previewStatus.textContent = 'Preview: ' + data.browser_url;
                previewStatus.style.color = '#4ade80';
                window.open(data.browser_url, '_blank');
            } else {
                previewStatus.innerHTML = 'Error: ' + (data.error || 'failed') + 
                    (data.files ? '<br><small style="color:#888;">Files: ' + data.files.join(', ') + '</small>' : '');
                previewStatus.style.color = '#f87171';
            }
        }
        
        async function quickPreview() {
            // Quick preview - uses default workspace
            var res = await fetch(API_BASE + '/api/preview');
            var data = await res.json();
            var previewStatus = document.getElementById('previewStatus');
            if (data.success) {
                previewStatus.textContent = 'Preview: ' + data.browser_url;
                previewStatus.style.color = '#4ade80';
                window.open(data.browser_url, '_blank');
            } else {
                previewStatus.innerHTML = 'Error: ' + (data.error || 'failed');
                previewStatus.style.color = '#f87171';
            }
        }
        
        async function stopPreview() {
            await fetch(API_BASE + '/api/stop', { method: 'POST' });
            document.getElementById('previewStatus').textContent = 'Stopped';
            document.getElementById('previewStatus').style.color = '#4ade80';
        }
        
        async function handleUpload(files) {
            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var formData = new FormData();
                formData.append('file', file);
                var res = await fetch(API_BASE + '/api/upload', { method: 'POST', body: formData });
                var data = await res.json();
                if (data.path) {
                    uploadPaths.push(data.path);
                    var container = document.getElementById('uploads');
                    container.innerHTML += '<span style="background:#2a2a3a;padding:5px 10px;border-radius:15px;font-size:12px;">IMG ' + file.name + '</span>';
                }
            }
        }
        
        // Auto-refresh providers every 30s
        refreshProviders();
        setInterval(refreshProviders, 30000);
    </script>
</body>
</html>
